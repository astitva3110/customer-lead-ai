<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>earKART Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      margin: 0;
      background: #0f1419;
      color: #e7ecf1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #2a3441;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #9aa8b8;
    }
    header select {
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #3d4f63;
      background: #1a2332;
      color: #e7ecf1;
    }
    .chat-shell {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 1.25rem 1.25rem;
      min-height: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 300px;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 0.9rem;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: #2563eb; }
    .msg.bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .msg.error { align-self: center; background: #7f1d1d; font-size: 0.9rem; }
    .composer {
      display: flex;
      gap: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #2a3441;
    }
    .composer input {
      flex: 1;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #3d4f63;
      background: #1a2332;
      color: #e7ecf1;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>earKART Chat</h1>
    <label>
      Country
      <select id="country">
        <option value="">Ask me</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="AU">Australia</option>
      </select>
    </label>
  </header>
  <section class="chat-shell">
    <div class="messages" id="messages"></div>
    <form class="composer" id="chatForm">
      <input type="text" id="message" placeholder="Ask about earKART products..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </section>
  <script>
    let conversationId = localStorage.getItem("earkart_conversation_id") || "";
    const messages = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const countrySelect = document.getElementById("country");
    countrySelect.value = localStorage.getItem("earkart_country") || "";
    countrySelect.addEventListener("change", () => {
      localStorage.setItem("earkart_country", countrySelect.value);
    });

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(text) {
      sendBtn.disabled = true;
      addMessage(text, "user");
      messageInput.value = "";
      try {
        const body = { message: text };
        if (conversationId) body.conversation_id = conversationId;
        if (countrySelect.value) body.country = countrySelect.value;
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          addMessage(typeof err.detail === "string" ? err.detail : "Chat request failed", "error");
          return;
        }
        const data = await res.json();
        conversationId = data.conversation_id;
        localStorage.setItem("earkart_conversation_id", conversationId);
        addMessage(data.response || data.answer || "(no response)", "bot");
      } catch (e) {
        addMessage("Could not reach the server.", "error");
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) sendMessage(text);
    });

    addMessage("Hi! Ask me about earKART hearing aids, products, or support.", "bot");
    messageInput.focus();
  </script>
</body>
</html>
